name: kaizen-go-demo

on:
  workflow_dispatch:
    inputs:
      ticketId:
        description: "対象チケットID（空白=GO待ち最初の1件）"
        required: false
        default: ""
      action:
        description: "アクション: go / fix / reject"
        required: false
        default: "go"
      # 【2026-08-15 社長指示・廃止】カイゼンくん自身の自動改修（executor:"kaizen"）は廃止した。
      # GOは真田専用LINEチャネル経由（executor:"sanada"）のみ有効。kaizen/空を指定すると
      # applyGoAction が状態を変えずno-op（案内メッセージのみ）を返す。デフォルトをsanadaにして
      # この手動デモが誤って何も起きないno-opにならないようにする。
      executor:
        description: "実装者: sanada（既定・真田実装中にする） / kaizen（廃止済み・no-opになる）"
        required: false
        default: "sanada"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/admin/go
        env:
          # 本番は ADMIN_GO_SECRET が設定されていれば x-admin-go-secret しか受け付けない
          # （lib/cronAuth.ts checkAdminGoAuth。共用CRON_SECRETでのGO奪取を塞ぐため）。
          # CRON_SECRET だけを送る旧実装は本番で401になる。両方送って非本番のフォールバックも保つ。
          ADMIN_GO_SECRET: ${{ secrets.ADMIN_GO_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TICKET_ID: ${{ github.event.inputs.ticketId }}
          ACTION: ${{ github.event.inputs.action }}
          EXECUTOR: ${{ github.event.inputs.executor }}
        run: |
          BODY=$(jq -nc \
            --arg action "$ACTION" \
            --arg ticketId "$TICKET_ID" \
            --arg executor "$EXECUTOR" \
            '{action: $action}
             + (if $ticketId == "" then {} else {ticketId: $ticketId} end)
             + (if $executor == "" then {} else {executor: $executor} end)')
          echo "Request: $BODY"
          RES=$(curl -sS -X POST "https://kaizen.takagi.bz/api/admin/go" \
            -H "x-admin-go-secret: ${ADMIN_GO_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -d "$BODY")
          echo "Response: $RES"
          echo "$RES" | jq .
